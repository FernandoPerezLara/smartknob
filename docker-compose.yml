# TODO: Check if these tasks can be run with xtask instead of docker-compose

services:
  lint:
    build: .
    command: cargo +nightly fmt --all -- --check
    volumes:
      - .:/app
    profiles:
      - ci

  build:
    build: .
    command: cargo +nightly clippy --release -- -D warnings
    volumes:
      - .:/app
    profiles:
      - ci
