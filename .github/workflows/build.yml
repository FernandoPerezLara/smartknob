name: Build

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build build
        working-directory: ./firmware

      - name: Run build release
        run: docker compose run build
        working-directory: ./firmware
